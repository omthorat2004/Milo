[project]
name = "milo-backend"
version = "0.1.0"
description = "Milo backend. Resume tracking links, anonymous analytics events, dashboards."
authors = [
    {name = "omthorat2004",email = "omthorat1005@gmail.com"}
]
readme = "README.md"
license = "LicenseRef-Elastic-2.0"
# PEP 440 syntax, not Poetry's caret. [project] is a PEP 621 table, so tools
# like ruff, mypy and pip parse this field directly and reject "^3.12".
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.3,<0.53.0)",
    "motor (>=3.7.1,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "milo_backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
